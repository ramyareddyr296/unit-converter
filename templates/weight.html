<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 40px 20px;
        }

        main {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: #4338ca;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        nav a {
            color: #4338ca;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            background: #4338ca;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .result {
            padding: 15px;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <main>
        <nav>
            <a href="{{ url_for('length') }}">Length</a>
            <a href="{{ url_for('weight') }}">Weight</a>
            <a href="{{ url_for('temperature') }}">Temperature</a>
        </nav>

        <h1>Weight Converter</h1>
        <p>Convert between common units of weight.</p>

        <form method="POST">
            <label for="value">Enter value</label>
            <input
                id="value"
                name="value"
                type="number"
                step="any"
                min="0"
                required
                value="{{ request.form.get('value', '') }}"
            >

            <label for="from_unit">From</label>
            <select id="from_unit" name="from_unit">
                {% for unit in units %}
                <option
                    value="{{ unit }}"
                    {% if request.form.get('from_unit', 'Kilograms') == unit %}
                    selected
                    {% endif %}
                >{{ unit }}</option>
                {% endfor %}
            </select>

            <label for="to_unit">To</label>
            <select id="to_unit" name="to_unit">
                {% for unit in units %}
                <option
                    value="{{ unit }}"
                    {% if request.form.get('to_unit', 'Grams') == unit %}
                    selected
                    {% endif %}
                >{{ unit }}</option>
                {% endfor %}
            </select>

            <button type="submit">Convert</button>
        </form>

        {% if result is not none %}
        <p class="result" role="status">{{ result }}</p>
        {% endif %}

        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}
    </main>
</body>
</html>
